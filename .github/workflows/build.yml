name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libcjson-dev \
            libnl-3-dev libnl-route-3-dev \
            libnftables-dev \
            libxxhash-dev

      - name: Build and install libtev
        run: |
          git clone --recursive https://github.com/chemwolf6922/tiny-event-loop.git /tmp/tev
          cmake -B /tmp/tev/build -S /tmp/tev
          cmake --build /tmp/tev/build -j$(nproc)
          sudo cmake --install /tmp/tev/build
          sudo ldconfig

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build -j$(nproc)
